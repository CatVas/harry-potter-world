<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/main-min.css" />
    <title>Hogwarts students</title>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <h1 class="header__hd">Hogwarts students</h1>
      </div>
    </header>
    <main>
      <div class="container">
        <ul class="tabs tabs--col-4">
          <li class="tabs__item">
            <article class="character">
              <div class="character__img">
                <img
                  class="character__img-pic"
                  src="./img/harry-potter.png"
                  alt=""
                />
              </div>
              <div class="character__data">
                <p class="character__name">Harry Potter</p>
                <div class="character__info">
                  <p>The Boy Who Lived</p>
                  <p>Gryffindor</p>
                  <p>31-07-1980</p>
                </div>
                <p class="character__link">
                  <a class="character__link-a" href="#">More info</a>
                </p>
              </div>
            </article>
          </li>
          <li class="tabs__item">A</li>
          <li class="tabs__item">A</li>
          <li class="tabs__item">A</li>
          <li class="tabs__item">A</li>
        </ul>
      </div>
    </main>
    <script src="./js/script.js"></script>
  </body>
</html>
